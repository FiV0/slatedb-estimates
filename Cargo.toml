[package]
name = "slatedb-estimates"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.88"
description = "Approximate range statistics built on SlateDB metadata"
documentation = "https://docs.rs/slatedb-estimates"
readme = "README.md"
repository = "https://github.com/FiV0/slatedb-estimates"
license = "Apache-2.0"
keywords = ["slatedb", "database", "storage", "statistics"]
exclude = [".github/", "AGENTS.md", "CLAUDE.md"]

[dependencies]
slatedb = { git = "https://github.com/FiV0/slatedb", rev = "b0290e7d9c28c3c47cf3bd67a0018eaef5ca76c6", default-features = false }

[dev-dependencies]
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
